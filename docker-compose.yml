services:
  db:
    image: postgres:16-alpine
    container_name: eventanalyzer-db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eventanalyzer_db}
      POSTGRES_USER: ${POSTGRES_USER:-eventanalyzer_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventanalyzer_secure_pass_2026}
      TZ: ${TZ:-Asia/Bangkok}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eventanalyzer_user} -d ${POSTGRES_DB:-eventanalyzer_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eventanalyzer-net

  redis:
    image: redis:7-alpine
    container_name: eventanalyzer-redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eventanalyzer-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eventanalyzer-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    command: sh -c "sed -i 's/\r$//' /app/entrypoint.sh && exec /app/entrypoint.sh"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - PORT=8000
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eventanalyzer-net

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eventanalyzer-celery
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    command: sh -c "celery -A analyzer_project worker -B -l info --concurrency=4"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - eventanalyzer-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eventanalyzer-frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    ports:
      - "${PORT:-8089}:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - eventanalyzer-net

networks:
  eventanalyzer-net:
    driver: bridge
